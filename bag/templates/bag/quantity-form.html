<!-- Quantity Form -->
<form class="form update-form" method="POST" action="{% url 'adjust_bag' item.item_id %}">
    {% csrf_token %}
    <div class="form-group">
        <div class="input-group">
            {% include 'products/includes/quantity_input.html' with input_id='id_qty_'|add:item.item_id input_name='quantity' initial_value=item.quantity min_value=1 max_value=99 %}
            {% if item.product.has_sizes %}
            <input type="hidden" name="product_size" value="{{ item.size }}" />
            {% endif %}
        </div>
    </div>
    <div class="lovefitness-bag-actions">
        <button type="submit" class="btn btn-sm lovefitness-bag__button lovefitness-bag__button--update update-link">Update</button>
        <button type="button" class="btn btn-sm lovefitness-bag__button lovefitness-bag__button--remove remove-item" id="remove_{{ item.item_id }}" data-item-id="{{ item.item_id }}" data-product_size="{{ item.size|default:'' }}">Remove</button>
    </div>
</form>
