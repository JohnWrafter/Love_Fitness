sive" font-size="19" font-weight="700" fill="#39433f">Privacy and safety: answers sent to OpenAI; general fitness information, not medical advice.</text><text x="116" y="326" font-family="Comic Sans MS, Chalkboard, cursive" font-size="13" font-weight="400" fill="#737d78">Consult a qualified professional for injuries or health concerns.</text><rect x="90" y="374" width="1020" height="406" rx="10" fill="#fffef9" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="110" y="406" font-family="Comic Sans MS, Chalkboard, cursive" font-size="19" font-weight="700" fill="#39433f">Tell us about your training</text><text x="116" y="430" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">FITNESS GOAL</text><rect x="116" y="438" width="460" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="130" y="468" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">Choose a goal</text><text x="622" y="430" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">EXPERIENCE LEVEL</text><rect x="622" y="438" width="460" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="636" y="468" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">Choose a level</text><text x="116" y="502" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">DAYS PER WEEK</text><rect x="116" y="510" width="292" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="130" y="540" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">3 days</text><text x="426" y="502" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">WORKOUT DURATION</text><rect x="426" y="510" width="292" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="440" y="540" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">45 minutes</text><text x="736" y="502" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">WORKOUT LOCATION</text><rect x="736" y="510" width="346" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="750" y="540" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">At home</text><text x="116" y="574" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">AVAILABLE EQUIPMENT</text><rect x="116" y="582" width="460" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="130" y="612" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">Dumbbells, bands, or none</text><text x="622" y="574" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">LIMITATIONS (OPTIONAL)</text><rect x="622" y="582" width="460" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="636" y="612" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">Share only what is needed</text><rect x="116" y="672" width="18" height="18" rx="3" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="146" y="687" font-family="Comic Sans MS, Chalkboard, cursive" font-size="13" font-weight="400" fill="#39433f">I consent to sending these answers to OpenAI.</text><rect x="116" y="718" width="230" height="42" rx="7" fill="#e4edb8" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="129" y="745" font-family="Comic Sans MS, Chalkboard, cursive" font-size="14" font-weight="700" fill="#39433f">CREATE MY ROUTINE</text><rect x="90" y="803" width="1020" height="100" rx="10" fill="#fffef9" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="110" y="835" font-family="Comic Sans MS, Chalkboard, cursive" font-size="19" font-weight="700" fill="#39433f">Generated routine: weekly schedule, warm-up, exercises, rest, progression.</text>
