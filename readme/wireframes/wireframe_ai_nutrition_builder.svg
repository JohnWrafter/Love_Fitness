" font-size="19" font-weight="700" fill="#39433f">Privacy and nutrition: answers sent to OpenAI; general meal ideas, not medical advice.</text><text x="116" y="326" font-family="Comic Sans MS, Chalkboard, cursive" font-size="13" font-weight="400" fill="#737d78">No calorie or macro targets. Check all ingredients and labels, especially for allergens.</text><rect x="90" y="384" width="1020" height="398" rx="10" fill="#fffef9" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="110" y="416" font-family="Comic Sans MS, Chalkboard, cursive" font-size="19" font-weight="700" fill="#39433f">Tell us what works for you</text><text x="116" y="440" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">NUTRITION GOAL</text><rect x="116" y="448" width="460" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="130" y="478" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">Balanced everyday meals</text><text x="622" y="440" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">DIETARY PREFERENCES</text><rect x="622" y="448" width="460" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="636" y="478" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">Vegetarian / vegan / no preference</text><text x="116" y="512" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">ALLERGIES OR RESTRICTIONS</text><rect x="116" y="520" width="966" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="130" y="550" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">List foods to exclude, or none</text><text x="116" y="584" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">MEALS PER DAY</text><rect x="116" y="592" width="292" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="130" y="622" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">3</text><text x="426" y="584" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">COOKING TIME</text><rect x="426" y="592" width="292" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="440" y="622" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">About 30 minutes</text><text x="736" y="584" font-family="Comic Sans MS, Chalkboard, cursive" font-size="12" font-weight="700" fill="#737d78">FOOD BUDGET</text><rect x="736" y="592" width="346" height="42" rx="5" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="750" y="622" font-family="Comic Sans MS, Chalkboard, cursive" font-size="15" font-weight="400" fill="#737d78">Budget-friendly</text><rect x="116" y="672" width="18" height="18" rx="3" fill="white" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="146" y="687" font-family="Comic Sans MS, Chalkboard, cursive" font-size="13" font-weight="400" fill="#39433f">I consent to sending these answers to OpenAI.</text><rect x="116" y="718" width="245" height="42" rx="7" fill="#e4edb8" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="129" y="745" font-family="Comic Sans MS, Chalkboard, cursive" font-size="14" font-weight="700" fill="#39433f">CREATE MY MEAL PLAN</text><rect x="90" y="803" width="1020" height="100" rx="10" fill="#fffef9" stroke="#39433f" stroke-width="2.2" stroke-linejoin="round"/><text x="110" y="835" font-family="Comic Sans MS, Chalkboard, cursive" font-size="19" font-weight="700" fill="#39433f">Generated meal ideas: meals and preparation suggestions respecting preferences.</text>
